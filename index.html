<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook Reliability Console</title><style>body{font-family:Inter,system-ui;background:#0b1220;color:#e5e7eb;margin:0;padding:40px}main{max-width:900px;margin:auto}h1{color:#d6a84b}section{background:#111b2e;border:1px solid #263653;border-radius:14px;padding:24px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{padding:16px;background:#17233a;border-radius:10px}.ok{color:#54d68a}.warn{color:#f5b94c}button{background:#d6a84b;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}</style></head><body><main><h1>Webhook Reliability Console</h1><p>An operations console for inspecting webhook deliveries, retries, idempotency keys, and dead-letter events.</p><section><div class="grid"><div class="card"><strong class="ok">Operational</strong><br>Live demo state</div><div class="card"><strong>99.9%</strong><br>Target reliability</div><div class="card"><strong>Accessible</strong><br>Keyboard-first flows</div></div></section><section><h2>Interactive workflow</h2><p id="status">Ready to inspect a sample workspace.</p><button onclick="document.getElementById('status').textContent='Analysis complete: 3 improvements identified and queued.'">Run analysis</button></section></main></body></html>
