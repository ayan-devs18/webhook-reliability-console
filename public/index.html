<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webhook Reliability Console</title>
<style>:root{color-scheme:dark;--gold:#e7bd63;--panel:#111b2e;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#08101e;color:#edf2f7}main{max-width:1100px;margin:auto;padding:40px 20px}h1{color:var(--gold);margin-bottom:6px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:24px 0}.card,.panel{background:var(--panel);border:1px solid #263653;border-radius:14px;padding:20px}.value{font-size:30px;font-weight:750}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #263653}.pill{border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.ok{background:#123d2d;color:#62e6a4}.fail{background:#492020;color:#ff9b9b}.retry{background:#4a3512;color:#ffd072}button{background:var(--gold);color:#18130a;border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}@media(max-width:700px){.panel{overflow-x:auto}}</style></head>
<body><main><header><h1>Webhook Reliability Console</h1><p class="muted">Inspect delivery failures, retry safely, and preserve idempotency.</p></header>
<section class="grid" aria-label="Delivery summary"><article class="card"><div class="muted">Success rate</div><div class="value">96.7%</div></article><article class="card"><div class="muted">Pending retries</div><div class="value" id="pending">2</div></article><article class="card"><div class="muted">Dead-letter events</div><div class="value">1</div></article><article class="card"><div class="muted">p95 latency</div><div class="value">412 ms</div></article></section>
<section class="panel"><h2>Recent deliveries</h2><table><thead><tr><th>Event</th><th>Endpoint</th><th>Status</th><th>Attempt</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>const ds=[{event:'invoice.paid',endpoint:'/billing/webhook',status:'Delivered',attempt:1},{event:'call.completed',endpoint:'/voice/events',status:'Retrying',attempt:2},{event:'lead.created',endpoint:'/crm/sync',status:'Failed',attempt:5},{event:'message.received',endpoint:'/inbox/events',status:'Retrying',attempt:3}];const rows=document.querySelector('#rows');function render(){rows.innerHTML=ds.map((d,i)=>`<tr><td>${d.event}</td><td><code>${d.endpoint}</code></td><td><span class="pill ${d.status==='Delivered'?'ok':d.status==='Failed'?'fail':'retry'}">${d.status}</span></td><td>${d.attempt}</td><td>${d.status==='Delivered'?'—':`<button data-i="${i}">Retry</button>`}</td></tr>`).join('');document.querySelector('#pending').textContent=ds.filter(d=>d.status==='Retrying').length}rows.addEventListener('click',e=>{if(!e.target.matches('button'))return;const d=ds[e.target.dataset.i];d.status='Delivered';d.attempt++;render()});render();</script></body></html>
